name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Write CI env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "Missing required secrets: DATABASE_URL and/or BETTER_AUTH_SECRET"
            exit 1
          fi

          cat <<EOF > .env.local
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          DATABASE_URL=$DATABASE_URL
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          BETTER_AUTH_URL=http://localhost:3000
          EOF

      - name: Run migrations
        run: bun run db:migrate

      - name: Lint and format checks
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build app
        run: bun run build
