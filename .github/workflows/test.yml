name: Run Lint, Type Check, and Test

env:
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.changes.outputs.src }}
    steps:
      - name: Notify Vercel
        if: ${{ !env.ACT }}
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - openblog: Run-Tests'

      - uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.base_ref || 'main' }}
          filters: |
            src:
              - '__tests__/**'
              - '.github/workflows/**'
              - 'drizzle/**'
              - 'public/**'
              - 'src/**'
              - 'biome.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'drizzle.config.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'playwright.config.ts'
              - 'postcss.config.mjs'
              - 'tsconfig.json'

  run-tests:
    needs: prepare
    if: ${{ needs.prepare.outputs.run-tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun download cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun check

      - name: Type check
        run: bun typecheck

      - name: Test
        run: bun test
