name: Run Lint, Type Check, and Test

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "__tests__/**"
      - "drizzle/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "drizzle.config.ts"
      - "components.json"
      - "biome.json"
      - ".github/workflows/test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "__tests__/**"
      - "drizzle/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "drizzle.config.ts"
      - "components.json"
      - "biome.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun download cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun check
      - name: Type check
        run: bun typecheck
      - name: Test
        run: bun test
