name: Run Lint, Type Check, and Test

env:
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

on:
  push:
    branches:
      - main
    paths:
      - '__tests__/**'
      - '.github/workflows/**'
      - 'drizzle/**'
      - 'public/**'
      - 'src/**'
      - 'biome.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'drizzle.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'playwright.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
  pull_request:
    branches:
      - main
    paths:
      - '__tests__/**'
      - '.github/workflows/**'
      - 'drizzle/**'
      - 'public/**'
      - 'src/**'
      - 'biome.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'drizzle.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'playwright.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - openblog: Run-Tests'

      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun check

      - name: Type check
        run: bun typecheck

      - name: Test
        run: bun test
